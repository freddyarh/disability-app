name: expo production
on:
  push:
    branches: ["main"]

jobs:
  update:
    name: EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "You must provide an EXPO_TOKEN secret linked to this project's Expo account in this repo's secrets. Learn more: https://docs.expo.dev/eas-update/github-actions"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # #region agent log
      - name: Debug environment
        run: |
          echo "node=$(node -v)"
          echo "npm=$(npm -v)"
          echo "which_yarn=$(command -v yarn || echo none)"
          echo "has_package_lock=$([ -f package-lock.json ] && echo yes || echo no)"
          echo "has_yarn_lock=$([ -f yarn.lock ] && echo yes || echo no)"
      # #endregion

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish production android
        run: eas build --profile production --platform android
